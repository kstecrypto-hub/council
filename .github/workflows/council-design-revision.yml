name: Council design revision
on:
  push:
    branches: [council-architecture-20261013]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'kstecrypto-hub/council' && !contains(github.event.head_commit.message, '[applied]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconcile documentation
        run: |
          python3 -m py_compile .maintenance/refine_review.py
          python3 .maintenance/refine_review.py
      - name: Check specification consistency
        run: |
          python3 tools/check_specs.py
          git diff --check e7cb20248059b7ad87c647b4f298e877c5545f0b -- README.md AGENTS.md VERIFICATION.md docs tools/check_specs.py
      - name: Record checked documentation on temporary branch
        run: |
          git config user.name 'Council documentation maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md AGENTS.md VERIFICATION.md docs tools/check_specs.py
          git commit -m 'Finish checkpoint and completion consistency review [applied]'
          git push origin HEAD:refs/heads/council-architecture-20261013
